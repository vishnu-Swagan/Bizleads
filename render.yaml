# Render blueprint for the BizLeads API.
#
# The frontend is deployed separately on Vercel; this hosts only the FastAPI
# backend. Render runs it as a long-lived process, which is how the app is
# written — it opens a connection pool at startup in its lifespan handler.
# Serverless would create one pool per instance and exhaust Postgres.
#
# Secrets are NOT in this file. Every `sync: false` value must be set in the
# Render dashboard (Environment tab) so nothing sensitive reaches the repo.

services:
  - type: web
    name: bizleads-api
    runtime: python
    plan: free
    region: frankfurt # nearest to the Supabase project in eu-west-2
    rootDir: app/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health

    envVars:
      # --- Database ---
      # Use the Supavisor POOLER host, not db.<ref>.supabase.co: the direct host
      # is IPv6-only and unreachable from most networks.
      # Session mode :5432 suits a long-lived process; :6543 is for serverless.
      #   postgresql+asyncpg://postgres.<ref>:<pw>@aws-1-eu-west-2.pooler.supabase.com:5432/postgres
      # Password must be percent-encoded (@ -> %40, $ -> %24).
      - key: DATABASE_URL
        sync: false

      # --- Supabase auth ---
      # Tokens are verified against the published ES256 JWKS. There is no shared
      # secret to configure; the backend holds only public material.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false

      # --- CORS ---
      # MUST contain the deployed frontend origin or every browser call fails.
      # A bare "*" is rejected at startup: combined with credentials it would
      # reopen the any-origin hole this app was audited for.
      # Must match the deployed frontend origin EXACTLY. If it does not, the
      # site loads, looks fine, and every API call fails CORS — while curl
      # against the API still returns healthy, which makes it hard to spot.
      - key: ALLOWED_ORIGINS
        value: https://bizleads-five.vercel.app

      # --- Providers ---
      # Use a PUBLIC pk. token restricted by URL, never an sk. secret token.
      - key: MAPBOX_ACCESS_TOKEN
        sync: false
      # Optional. Without it, website quality stays at the free heuristic tier.
      - key: PAGESPEED_API_KEY
        sync: false

      # --- Outreach email (SMTP) ---
      # Absent, /api/v1/outreach/send-email returns 503 and the Automations
      # page reports email as not configured. Nothing else breaks.
      #
      # Gmail: SMTP_PASSWORD must be a 16-character App Password from
      # https://myaccount.google.com/apppasswords (2-Step Verification must be
      # on first). A normal account password is always rejected. Google shows
      # the App Password with spaces for readability; they are stripped
      # automatically, so pasting it either way works.
      #
      # Gmail caps sending at ~500/day (2,000 on Workspace) and suspends
      # accounts used for cold outreach. For real volume use a transactional
      # provider on your own domain with SPF, DKIM and DMARC set up.
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USE_TLS
        value: "true"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false

      # --- Outreach email via Resend (preferred over SMTP) ---
      # Setting RESEND_API_KEY switches delivery to Resend automatically; no
      # other flag is needed, and the SMTP values above are then ignored.
      #
      # Resend needs a VERIFIED DOMAIN. Until torquetrendsllc.co.site is
      # verified in the Resend dashboard, the only address it will send to is
      # the one that owns the account — enough to test the pipeline, not
      # enough to reach prospects.
      #
      # Read Resend's acceptable use policy before sending cold outreach
      # through it: transactional providers generally prohibit unsolicited
      # email and suspend accounts that send it.
      - key: RESEND_API_KEY
        sync: false
      # Defaults to SMTP_FROM_EMAIL when unset. Must be on the verified domain.
      - key: RESEND_FROM_EMAIL
        sync: false

      # --- AI writing assistance ---
      # Optional. Without it the AI buttons report "not configured" and the
      # deterministic composer still writes every draft — outreach keeps
      # working, it simply loses the wording polish.
      #
      # The model is only ever asked to improve HOW something reads. It is
      # given the measured findings and the user's own text, and is
      # instructed to add no claim not already present. A lead with no
      # findings produces no email at all: the provider is not even called.
      # That is what keeps "every claim is verifiable" true once a language
      # model is in the loop.
      # Either provider works. Anthropic is preferred when both are set,
      # because it follows the "add no facts" instruction markedly more
      # reliably — and that instruction is the only thing standing between
      # this feature and the invented claims the product exists to avoid.
      - key: ANTHROPIC_API_KEY
        sync: false
      # NVIDIA NIM (build.nvidia.com) is free and OpenAI-compatible.
      - key: NVIDIA_API_KEY
        sync: false
      # Optional. Defaults to meta/llama-3.3-70b-instruct.
      - key: NVIDIA_MODEL
        sync: false

      # --- Stripe billing ---
      # STRIPE_SECRET_KEY: sk_live_... (sk_test_... while testing)
      # STRIPE_WEBHOOK_SECRET: whsec_..., shown when you add the endpoint at
      #   https://dashboard.stripe.com/webhooks pointing to
      #   https://bizleads.onrender.com/api/v1/payments/webhook
      #
      # The webhook secret is not optional for a subscription business. Without
      # it the endpoint is disabled, and then: a customer who closes the tab
      # after paying never gets activated, renewals never reset credits, and
      # cancellations never revoke access.
      #
      # Subscribe the endpoint to at least:
      #   checkout.session.completed, customer.subscription.created,
      #   customer.subscription.updated, customer.subscription.deleted,
      #   invoice.paid, invoice.payment_failed
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

      # --- Customer email credentials ---
      # Each customer stores their OWN sending credentials, so nothing can be
      # saved until this key exists. Encryption never falls back to plaintext:
      # a fallback that "works" is how credentials end up unencrypted in
      # production without anyone noticing.
      #
      # Generate with:
      #   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      #
      # ROTATING THIS KEY INVALIDATES EVERY STORED CREDENTIAL. Customers would
      # each have to re-enter their password or API key. Set it once and keep
      # it safe.
      - key: CREDENTIAL_ENCRYPTION_KEY
        sync: false

      # --- Scheduled automations ---
      # A long random value, e.g. `openssl rand -hex 32`. The SAME value must
      # be set as a GitHub repository secret named AUTOMATION_CRON_SECRET, so
      # .github/workflows/run-automations.yml can trigger due automations
      # hourly. Render's free tier has no cron and sleeps when idle, so
      # without this nothing fires a schedule and automations only ever run
      # when a human presses the button.
      #
      # Unset, the endpoint returns 401 and nothing runs — the correct
      # failure. Scheduled runs never send email; they search, qualify and
      # draft into the approval queue only.
      - key: AUTOMATION_CRON_SECRET
        sync: false

      # --- Safety rails ---
      # Must not be "dev": the exception handler returns full stack traces when
      # it is.
      - key: ENVIRONMENT
        value: production
      # SEED_MOCK_DATA is gone: the seeding code and its eight fabricated
      # sample leads were deleted outright, so there is no variable to set.
      - key: PYTHON_VERSION
        value: "3.13"
