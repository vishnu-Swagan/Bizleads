<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="BizLeads">
  <title>BizLeads</title>
  <defs>
    <linearGradient id="bl-tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#bl-tile)"/>
  <!--
    Three ascending bars: a business's measured web presence. The tallest is
    held back at 45% opacity - the gap between where a prospect is and where
    they could be, which is the whole product thesis. Solid-at-low-opacity
    rather than a stroked outline, because a 1px hole turns to mud at 16px.
  -->
  <g fill="#FFFFFF">
    <rect x="7.5" y="19" width="4.5" height="6.5" rx="1.6"/>
    <rect x="13.75" y="14" width="4.5" height="11.5" rx="1.6"/>
    <rect x="20" y="7.5" width="4.5" height="18" rx="1.6" opacity="0.45"/>
  </g>
</svg>
