<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!--
      Icons are served from this origin. They previously pointed at a
      third-party CDN (a "DefaultAppLogo.png" on a Tencent Cloud bucket), which
      sent every visitor's IP and user agent to an unrelated party before they
      had agreed to anything, and left the product's identity in someone
      else's control.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#4338CA" />

    <!-- viewport-fit=cover so the layout reaches under notches and home bars. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>BizLeads — Website Opportunity Intelligence</title>
    <meta
      name="description"
      content="Find local businesses whose websites are costing them customers. Real businesses from licensed data, measured against concrete checks — never generated."
    />

    <meta property="og:title" content="BizLeads — Website Opportunity Intelligence" />
    <meta
      property="og:description"
      content="Find local businesses whose websites are costing them customers. Real businesses from licensed data — never generated."
    />
    <meta property="og:image" content="https://bizleads-five.vercel.app/og-image.png" />
    <meta property="og:url" content="https://bizleads-five.vercel.app/" />
    <meta property="og:site_name" content="BizLeads" />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BizLeads — Website Opportunity Intelligence" />
    <meta
      name="twitter:description"
      content="Find local businesses whose websites are costing them customers. Real businesses from licensed data — never generated."
    />
    <meta name="twitter:image" content="https://bizleads-five.vercel.app/og-image.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
